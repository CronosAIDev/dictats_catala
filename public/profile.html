<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — Dictats en Català</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dictats">
  <script src="/a11y.js" defer></script>
  <script src="/rang.js" defer></script>
  <script src="/grafic.js" defer></script>
  <script src="/pwa.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Dictats en Català
      </div>
      <div class="user-info">
        <a href="/" class="btn btn-ghost btn-sm">← Tornar</a>
        <button class="btn btn-ghost btn-sm" id="btn-logout">Sortir</button>
      </div>
    </header>

    <main class="app-main">
      <h2 style="font-size:1.25rem;font-weight:600;margin-bottom:24px;letter-spacing:-.02em">El meu perfil</h2>

      <div id="profile-loading" style="text-align:center;padding:48px;color:var(--text-muted)">
        <div class="spinner" style="margin:0 auto 12px"></div>
        Carregant historial…
      </div>

      <div id="profile-content" style="display:none">
        <!-- Rang -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-body">
            <div class="rank-now" style="margin-top:0">
              <div>
                <span class="rank-name" id="rank-name" style="font-size:1.375rem"></span>
                <span class="rank-step" id="rank-step"></span>
                <div class="rank-what" id="rank-what"></div>
              </div>
              <span class="rank-points" id="rank-points"></span>
            </div>
            <div class="rank-bar" role="progressbar" aria-label="Progrés cap al rang següent"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="rank-bar-fill" id="rank-bar"></div></div>
            <div class="rank-next" id="rank-next"></div>
          </div>
          <div style="border-top:1px solid var(--border);padding:8px 0">
            <div class="rank-ladder" id="rank-ladder"></div>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="stats-grid"></div>

        <!-- De què són els teus errors (F26) -->
        <div class="card" id="falles-card" style="margin-bottom:20px;display:none">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20V10M12 20V4M18 20v-6"/></svg>
            <span class="card-title">De què són els teus errors</span>
            <span class="corba-nota" id="falles-abast" style="margin-left:auto"></span>
          </div>
          <div class="card-body">
            <p id="falles-titular" class="falles-titular"></p>
            <div id="falles-llista"></div>
            <p id="falles-nota" class="corba-nota" style="margin-top:12px;display:none"></p>
          </div>
        </div>

        <!-- Corba de progrés (F36) -->
        <div class="card" id="corba-card" style="margin-bottom:20px;display:none">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/></svg>
            <span class="card-title">Errors per 100 paraules</span>
            <span class="corba-nota" style="margin-left:auto">menys és millor</span>
          </div>
          <div class="card-body">
            <div id="corba"></div>
            <div id="corba-text" class="corba-millora"></div>
            <p id="corba-avis" class="corba-nota" style="margin-top:10px;display:none"></p>
          </div>
        </div>

        <!-- History -->
        <div class="card">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="card-title">Historial de dictats</span>
            <div style="margin-left:auto;display:flex;gap:6px">
              <button class="btn btn-primary btn-sm" id="tab-recents">Recents</button>
              <button class="btn btn-ghost btn-sm" id="tab-millors">Millors</button>
            </div>
          </div>
          <div class="card-body" style="padding:0">
            <div id="history-list"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // El listener va fora d'init(): amb l'historial buit init() fa return abans d'arribar-hi
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function init() {
      const res = await fetch('/api/profile');
      if (!res.ok) { window.location.href = '/login'; return; }
      const data = await res.json();

      document.getElementById('profile-loading').style.display = 'none';
      document.getElementById('profile-content').style.display = '';

      // Rang: on ets en conjunt. L'escala d'aquí sota diu com va anar cada dictat.
      const rank = data.rank;
      document.getElementById('rank-name').textContent = rank.rang.nom;
      document.getElementById('rank-step').textContent = `${rank.rang.nivell} de ${rank.rang.de}`;
      document.getElementById('rank-what').textContent = rank.rang.que;
      document.getElementById('rank-points').textContent = `${rank.punts} punts`;
      const pas = window.Rang.seguentPas(rank);
      if (window.A11y) window.A11y.progres(document.getElementById('rank-bar'), pas.amplada);
      else document.getElementById('rank-bar').style.width = pas.amplada + '%';
      document.getElementById('rank-next').textContent = pas.text;
      document.getElementById('rank-next').classList.toggle('rank-next-avis', pas.avis);

      // L'escala sencera, de baix a dalt com un castell de debò.
      document.getElementById('rank-ladder').innerHTML = data.ranks.map(r => {
        const actual = r.id === rank.rang.id;
        const estat = actual ? 'actual' : (rank.punts >= r.punts ? 'assolit' : 'pendent');
        return `
          <div class="rank-rung ${estat}">
            <span class="rung-nom">${escapeHtml(r.nom)}</span>
            <span class="rung-que">${escapeHtml(r.que)}</span>
            <span class="rung-punts">${r.punts}</span>
          </div>`;
      }).join('');

      // Stats. La ratxa no renya: si avui encara no n'has fet cap però ve d'ahir,
      // ho diu com una invitació, no com un avís de pèrdua.
      const ratxaText = r => {
        if (!r || r.dies === 0) return 'Dies seguits';
        if (r.enPerill) return r.dies === 1 ? 'Dia seguit · fes-ne un avui' : 'Dies seguits · fes-ne un avui';
        return r.dies === 1 ? 'Dia seguit' : 'Dies seguits';
      };

      // Els decimals es diuen amb coma, que és com s'escriuen en català.
      const coma = n => String(n).replace('.', ',');

      const scaleForAvg = errCount => {
        if (errCount === 0) return 'Excel·lent';
        if (errCount <= 2) return 'Molt bé';
        if (errCount <= 5) return 'Bé';
        if (errCount <= 9) return 'Progressant';
        return 'Segueix!';
      };

      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card">
          <div class="stat-number">${data.stats.total}</div>
          <div class="stat-label">Dictats fets</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${data.stats.bestErrors ?? '—'}</div>
          <div class="stat-label">Millor resultat (errors)</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${coma(data.stats.avgErrors)}</div>
          <div class="stat-label">Mitjana d'errors</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${data.stats.errorsPer100 === null ? '—' : coma(data.stats.errorsPer100)}</div>
          <div class="stat-label">Errors per 100 paraules</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" style="font-size:1.25rem">${scaleForAvg(Math.round(data.stats.avgErrors))}</div>
          <div class="stat-label">Nivell general</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${data.stats.ratxa.dies}</div>
          <div class="stat-label">${ratxaText(data.stats.ratxa)}</div>
        </div>
      `;

      // De què són els errors (F26). Amb la taxonomia de F25, «ortografia» ha
      // deixat de ser la resposta a tot i això es pot contestar de veritat.
      const falles = data.onFalles;
      if (falles && falles.regles && falles.regles.length) {
        document.getElementById('falles-card').style.display = '';
        document.getElementById('falles-abast').textContent =
          falles.dictats === 1 ? 'l\'últim dictat' : `els últims ${falles.dictats} dictats`;
        document.getElementById('falles-titular').textContent = falles.titular || '';
        // El que no és de cap regla es diu a part i sense rànquing: no haver
        // escrit una paraula no és una regla que es pugui estudiar, i deixar-ho
        // competir feia que el titular fos «el que més t'ha sortit és paraula
        // omesa» a qui havia deixat un dictat a mitges.
        const nota = document.getElementById('falles-nota');
        nota.textContent = falles.nota || '';
        nota.style.display = falles.nota ? '' : 'none';
        // La regla només s'ensenya de la primera: si es posessin totes, la
        // pantalla passaria a ser un llibre de gramàtica i no es llegiria cap.
        document.getElementById('falles-llista').innerHTML = falles.regles.map((r, i) => `
          <div class="falla">
            <div class="falla-cap">
              <span class="falla-nom">${escapeHtml(r.nom)}</span>
              <span class="falla-quants">${r.quants}</span>
            </div>
            <div class="falla-barra"><div class="falla-barra-plena" style="width:${r.part}%"></div></div>
            ${i === 0 ? `<p class="falla-regla">${escapeHtml(r.regla)}</p>` : ''}
          </div>
        `).join('') + (falles.resta && falles.resta.regles
          ? `<p class="falla-resta">I ${falles.resta.regles} regles més, amb `
            + `${falles.resta.errors} error${falles.resta.errors === 1 ? '' : 's'} en total.</p>`
          : '');
      }

      // La corba (F36). Només es pinta si hi ha alguna setmana amb dades
      // comparables: un gràfic buit no informa de res i ocupa mitja pantalla.
      const corba = window.Grafic ? window.Grafic.setmanes(data.setmanes) : '';
      if (corba) {
        document.getElementById('corba-card').style.display = '';
        document.getElementById('corba').innerHTML = corba;
        // La tendència només parla quan ha anat a millor (mai renyar). Quan no,
        // la corba ja ensenya els nombres: no s'amaga res, no s'hi posa text.
        document.getElementById('corba-text').textContent =
          (data.tendencia && data.tendencia.text) || '';

        // Si part de l'historial no sap quantes paraules tenia, es diu. És
        // preferible a ensenyar una xifra que sembla de tot i no ho és.
        const fora = data.stats.total - data.stats.dictatsComptats;
        if (fora > 0) {
          const avis = document.getElementById('corba-avis');
          avis.style.display = '';
          avis.textContent = fora === 1
            ? 'Un dictat antic no va desar quantes paraules tenia i no entra en aquesta xifra.'
            : `${fora} dictats antics no van desar quantes paraules tenien i no entren en aquesta xifra.`;
        }
      }

      // Historial amb dues pestanyes: Recents (per data) i Millors (per errors)
      const levelLabel = { basic:'Bàsic', intermedi:'Intermedi', avancat:'Avançat', personal:'Personal', unknown:'—' };

      const pinta = llista => {
        if (llista.length === 0) {
          document.getElementById('history-list').innerHTML =
            '<div style="padding:24px;color:var(--text-muted);font-size:.875rem">Encara no has fet cap dictat.</div>';
          return;
        }
        document.getElementById('history-list').innerHTML = llista.map(r => `
          <div class="history-item">
            <div class="history-meta">
              <span class="history-title">${escapeHtml(r.text_title || r.text_id)}</span>
              <span class="history-level">${escapeHtml(levelLabel[r.level] || r.level)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
              <span class="scale-badge ${r.scale.cls}">${r.scale.label}</span>
              <span class="history-errors">${r.errors_count} error${r.errors_count !== 1 ? 's' : ''}</span>
              <span class="history-date">${new Date(r.completed_at).toLocaleDateString('ca-ES', {day:'2-digit',month:'short',year:'numeric'})}</span>
            </div>
          </div>
        `).join('');
      };

      const tabs = {
        'tab-recents': data.history,
        'tab-millors': data.millors || data.history,
      };
      for (const id of Object.keys(tabs)) {
        document.getElementById(id).addEventListener('click', () => {
          for (const altre of Object.keys(tabs)) {
            document.getElementById(altre).className =
              `btn ${altre === id ? 'btn-primary' : 'btn-ghost'} btn-sm`;
          }
          pinta(tabs[id]);
        });
      }
      pinta(data.history);
    }

    init();
  </script>
</body>
</html>
