<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — Dictats en Català</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dictats">
  <script src="/pwa.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Dictats en Català
      </div>
      <div class="user-info">
        <a href="/" class="btn btn-ghost btn-sm">← Tornar</a>
        <button class="btn btn-ghost btn-sm" id="btn-logout">Sortir</button>
      </div>
    </header>

    <main class="app-main">
      <h2 style="font-size:1.25rem;font-weight:600;margin-bottom:24px;letter-spacing:-.02em">El meu perfil</h2>

      <div id="profile-loading" style="text-align:center;padding:48px;color:var(--text-muted)">
        <div class="spinner" style="margin:0 auto 12px"></div>
        Carregant historial…
      </div>

      <div id="profile-content" style="display:none">
        <!-- Rang -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-body">
            <div class="rank-now" style="margin-top:0">
              <div>
                <span class="rank-name" id="rank-name" style="font-size:1.375rem"></span>
                <span class="rank-step" id="rank-step"></span>
                <div class="rank-what" id="rank-what"></div>
              </div>
              <span class="rank-points" id="rank-points"></span>
            </div>
            <div class="rank-bar"><div class="rank-bar-fill" id="rank-bar"></div></div>
            <div class="rank-next" id="rank-next"></div>
          </div>
          <div style="border-top:1px solid var(--border);padding:8px 0">
            <div class="rank-ladder" id="rank-ladder"></div>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="stats-grid"></div>

        <!-- History -->
        <div class="card">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="card-title">Historial de dictats</span>
            <div style="margin-left:auto;display:flex;gap:6px">
              <button class="btn btn-primary btn-sm" id="tab-recents">Recents</button>
              <button class="btn btn-ghost btn-sm" id="tab-millors">Millors</button>
            </div>
          </div>
          <div class="card-body" style="padding:0">
            <div id="history-list"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // El listener va fora d'init(): amb l'historial buit init() fa return abans d'arribar-hi
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function init() {
      const res = await fetch('/api/profile');
      if (!res.ok) { window.location.href = '/login'; return; }
      const data = await res.json();

      document.getElementById('profile-loading').style.display = 'none';
      document.getElementById('profile-content').style.display = '';

      // Rang: on ets en conjunt. L'escala d'aquí sota diu com va anar cada dictat.
      const rank = data.rank;
      document.getElementById('rank-name').textContent = rank.rang.nom;
      document.getElementById('rank-step').textContent = `${rank.rang.nivell} de ${rank.rang.de}`;
      document.getElementById('rank-what').textContent = rank.rang.que;
      document.getElementById('rank-points').textContent = `${rank.punts} punts`;
      if (rank.seguent) {
        document.getElementById('rank-bar').style.width = Math.max(0, Math.min(100, rank.seguent.progres)) + '%';
        document.getElementById('rank-next').textContent =
          `Et falten ${rank.seguent.falten} punts per a ${rank.seguent.nom}.`;
      } else {
        document.getElementById('rank-bar').style.width = '100%';
        document.getElementById('rank-next').textContent = 'Has coronat el castell. No hi ha res més amunt.';
      }

      // L'escala sencera, de baix a dalt com un castell de debò.
      document.getElementById('rank-ladder').innerHTML = data.ranks.map(r => {
        const actual = r.id === rank.rang.id;
        const estat = actual ? 'actual' : (rank.punts >= r.punts ? 'assolit' : 'pendent');
        return `
          <div class="rank-rung ${estat}">
            <span class="rung-nom">${escapeHtml(r.nom)}</span>
            <span class="rung-que">${escapeHtml(r.que)}</span>
            <span class="rung-punts">${r.punts}</span>
          </div>`;
      }).join('');

      // Stats
      const scaleForAvg = errCount => {
        if (errCount === 0) return 'Excel·lent';
        if (errCount <= 2) return 'Molt bé';
        if (errCount <= 5) return 'Bé';
        if (errCount <= 9) return 'Progressant';
        return 'Segueix!';
      };

      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card">
          <div class="stat-number">${data.stats.total}</div>
          <div class="stat-label">Dictats fets</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${data.stats.bestErrors ?? '—'}</div>
          <div class="stat-label">Millor resultat (errors)</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${data.stats.avgErrors}</div>
          <div class="stat-label">Mitjana d'errors</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" style="font-size:1.25rem">${scaleForAvg(data.stats.avgErrors)}</div>
          <div class="stat-label">Nivell general</div>
        </div>
      `;

      // Historial amb dues pestanyes: Recents (per data) i Millors (per errors)
      const levelLabel = { basic:'Bàsic', intermedi:'Intermedi', avancat:'Avançat', personal:'Personal', unknown:'—' };

      const pinta = llista => {
        if (llista.length === 0) {
          document.getElementById('history-list').innerHTML =
            '<div style="padding:24px;color:var(--text-muted);font-size:.875rem">Encara no has fet cap dictat.</div>';
          return;
        }
        document.getElementById('history-list').innerHTML = llista.map(r => `
          <div class="history-item">
            <div class="history-meta">
              <span class="history-title">${escapeHtml(r.text_title || r.text_id)}</span>
              <span class="history-level">${escapeHtml(levelLabel[r.level] || r.level)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
              <span class="scale-badge ${r.scale.cls}">${r.scale.label}</span>
              <span class="history-errors">${r.errors_count} error${r.errors_count !== 1 ? 's' : ''}</span>
              <span class="history-date">${new Date(r.completed_at).toLocaleDateString('ca-ES', {day:'2-digit',month:'short',year:'numeric'})}</span>
            </div>
          </div>
        `).join('');
      };

      const tabs = {
        'tab-recents': data.history,
        'tab-millors': data.millors || data.history,
      };
      for (const id of Object.keys(tabs)) {
        document.getElementById(id).addEventListener('click', () => {
          for (const altre of Object.keys(tabs)) {
            document.getElementById(altre).className =
              `btn ${altre === id ? 'btn-primary' : 'btn-ghost'} btn-sm`;
          }
          pinta(tabs[id]);
        });
      }
      pinta(data.history);
    }

    init();
  </script>
</body>
</html>
