<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Dictats — Mòbil</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dictats">
  <script src="/report.js" defer></script>
  <script src="/pwa.js" defer></script>
  <style>
    body { background: var(--bg); }
    .mobile-shell { display:flex; flex-direction:column; min-height:100vh; }
    .mobile-header {
      background:var(--surface); border-bottom:1px solid var(--border);
      padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:10;
    }
    .mobile-logo { font-size:.9375rem; font-weight:700; color:var(--primary); }
    .mobile-main { flex:1; padding:16px; max-width:540px; margin:0 auto; width:100%; }

    .mobile-view { display:none; }
    .mobile-view.active { display:block; }

    .big-btn {
      width:100%; padding:18px; font-size:1.125rem; font-weight:600;
      border-radius:12px; border:none; cursor:pointer; font-family:inherit;
      transition:opacity .15s, transform .1s;
    }
    .big-btn:active { transform:scale(0.97); }
    .big-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .big-btn-primary { background:var(--primary); color:white; }
    .big-btn-ghost { background:var(--surface); color:var(--text); border:2px solid var(--border); }
    .big-btn-success { background:#16a34a; color:white; }

    /* Els controls del dictat caben de dos en dos: prement-los amb el polze
       mentre s'escriu amb l'altra mà. */
    .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

    .mobile-level-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .mobile-level-card {
      background:var(--surface); border:2px solid var(--border); border-radius:12px;
      padding:16px 12px; text-align:center; cursor:pointer; transition:border-color .15s;
    }
    .mobile-level-card.active { border-color:var(--primary); background:var(--primary-light); }
    .mobile-level-card .lv-icon { font-size:1.75rem; margin-bottom:6px; }
    .mobile-level-card .lv-name { font-size:.875rem; font-weight:600; }

    .mobile-text-item {
      background:var(--surface); border:1px solid var(--border); border-radius:10px;
      padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:border-color .15s;
    }
    .mobile-text-item:active { border-color:var(--primary); background:var(--primary-light); }
    .mobile-text-item .mt-title { font-weight:600; font-size:.9375rem; margin-bottom:2px; }
    .mobile-text-item .mt-meta { font-size:.8125rem; color:var(--text-muted); }

    .mobile-progress { margin:16px 0; }
    .mobile-phrase-info { text-align:center; font-size:.875rem; color:var(--text-muted); margin-bottom:12px; }

    .photo-upload-big {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      border:2px dashed var(--border); border-radius:12px; padding:32px 16px;
      cursor:pointer; background:var(--surface); transition:border-color .15s; gap:12px;
      text-align:center;
    }
    .photo-upload-big:active { border-color:var(--primary); }
    .photo-upload-big svg { color:var(--text-muted); }
    .photo-upload-big span { font-size:.9375rem; color:var(--text-muted); }

    .mobile-result-label {
      text-align:center; padding:24px 16px 16px;
      font-size:2rem; font-weight:700; margin-bottom:4px;
    }
    .mobile-result-sub { text-align:center; font-size:1rem; color:var(--text-muted); margin-bottom:8px; }
    .mobile-result-stats { text-align:center; font-size:.875rem; color:var(--text-muted); margin-bottom:20px; }
  </style>
</head>
<body>
  <div class="mobile-shell">
    <header class="mobile-header">
      <span class="mobile-logo">✏️ Dictats en Català</span>
      <div style="display:flex;gap:8px">
        <a href="/profile" class="btn btn-ghost btn-sm" title="El meu progrés">📊</a>
        <a href="/" class="btn btn-ghost btn-sm" title="Versió d'escriptori">🖥️</a>
        <button class="btn btn-ghost btn-sm" id="m-logout">Sortir</button>
      </div>
    </header>

    <main class="mobile-main">

      <!-- VIEW: Nivell -->
      <div id="m-view-level" class="mobile-view active">
        <h2 style="font-size:1.125rem;font-weight:600;margin-bottom:16px">Escull un nivell</h2>
        <div class="mobile-level-grid">
          <div class="mobile-level-card active" data-level="basic"><div class="lv-icon">🌱</div><div class="lv-name">Bàsic</div></div>
          <div class="mobile-level-card" data-level="intermedi"><div class="lv-icon">📖</div><div class="lv-name">Intermedi</div></div>
          <div class="mobile-level-card" data-level="avancat"><div class="lv-icon">🎓</div><div class="lv-name">Avançat</div></div>
          <div class="mobile-level-card" data-level="personal"><div class="lv-icon">✏️</div><div class="lv-name">Els meus</div></div>
        </div>
        <button class="big-btn big-btn-ghost" id="m-btn-add-text" style="display:none;margin-bottom:14px">+ Afegir un text meu</button>
        <div id="m-text-list"></div>
      </div>

      <!-- VIEW: Dictació -->
      <div id="m-view-dictation" class="mobile-view">
        <button class="btn btn-ghost btn-sm" id="m-back-level" style="margin-bottom:16px">← Tornar</button>
        <div class="card" style="margin-bottom:16px">
          <div class="card-body">
            <h3 id="m-dictation-title" style="font-size:1rem;font-weight:600;margin-bottom:4px"></h3>
            <div id="m-level-badge" style="font-size:.8125rem;color:var(--text-muted);margin-bottom:16px"></div>

            <div id="m-status-badge" style="margin-bottom:12px"></div>
            <div class="mobile-progress">
              <div class="progress-bar-wrap"><div class="progress-bar-fill" id="m-progress-bar"></div></div>
            </div>
            <div class="mobile-phrase-info" id="m-phrase-indicator"></div>

            <div style="display:flex;flex-direction:column;gap:10px">
              <button class="big-btn big-btn-primary" id="m-btn-start">▶ Iniciar dictat</button>
              <div class="btn-row" id="m-controls" style="display:none">
                <button class="big-btn big-btn-ghost" id="m-btn-repeat">↻ Repetir</button>
                <button class="big-btn big-btn-ghost" id="m-btn-pause">⏸ Pausar</button>
                <button class="big-btn big-btn-ghost" id="m-btn-next">Següent →</button>
                <button class="big-btn big-btn-ghost" id="m-btn-extend">+10 s</button>
              </div>
            </div>

            <div class="dictation-settings" style="margin-top:16px">
              <label class="setting" for="m-speech-rate">
                <span>Velocitat</span>
                <input type="range" id="m-speech-rate" min="0.5" max="1" step="0.05">
                <span class="setting-value" id="m-speech-rate-value">0,75×</span>
              </label>
              <label class="setting" for="m-dictate-punctuation">
                <input type="checkbox" id="m-dictate-punctuation">
                <span>Dictar la puntuació</span>
              </label>
            </div>

            <div id="m-voice-warning" class="alert alert-warning" style="display:none"></div>
          </div>
        </div>

        <!-- Escriure o paper -->
        <div class="card" style="margin-bottom:16px">
          <div class="card-body">
            <div class="mode-toggle">
              <button class="mode-btn active" id="m-mode-write">Escriure aquí</button>
              <button class="mode-btn" id="m-mode-paper">Paper i foto</button>
            </div>

            <div id="m-write-zone">
              <textarea id="m-user-text" class="form-input textarea"
                placeholder="Escriu aquí el que sents…"
                style="min-height:180px;font-size:1.0625rem"></textarea>
              <button class="big-btn big-btn-success" id="m-btn-correct" style="margin-top:12px" disabled>Corregir</button>
            </div>

            <div id="m-paper-zone" style="display:none">
              <label class="photo-upload-big" for="m-photo-input">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <span id="m-photo-label">Fer foto o triar de la galeria</span>
              </label>
              <input type="file" id="m-photo-input" accept="image/*" capture="environment" style="display:none">
              <img id="m-photo-preview" style="display:none;width:100%;border-radius:10px;margin-top:12px;border:1px solid var(--border)">
              <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
                <button class="big-btn big-btn-success" id="m-btn-correct-photo" disabled>Corregir amb la foto</button>
                <button class="big-btn big-btn-ghost" id="m-btn-skip-photo">Ometre (sense correcció)</button>
              </div>
            </div>
          </div>
        </div>

        <div id="m-correction-loading" style="display:none;text-align:center;padding:32px;color:var(--text-muted)">
          <div class="spinner" style="margin:0 auto 12px"></div>
          <span id="m-loading-msg">Corregint el dictat…</span>
        </div>
      </div>

      <!-- VIEW: Resultats -->
      <div id="m-view-results" class="mobile-view">
        <div id="m-result-label" class="mobile-result-label"></div>
        <div id="m-result-sub" class="mobile-result-sub"></div>
        <div id="m-result-stats" class="mobile-result-stats"></div>

        <div id="m-rank-block" class="rank-block" style="display:none;margin:0 0 16px">
          <div class="rank-delta" id="m-rank-delta"></div>
          <div class="rank-delta-note" id="m-rank-delta-note"></div>
          <div class="rank-change" id="m-rank-change" style="display:none"></div>
          <div class="rank-now">
            <div>
              <span class="rank-name" id="m-rank-name"></span>
              <span class="rank-step" id="m-rank-step"></span>
              <div class="rank-what" id="m-rank-what"></div>
            </div>
            <span class="rank-points" id="m-rank-points"></span>
          </div>
          <div class="rank-bar"><div class="rank-bar-fill" id="m-rank-bar"></div></div>
          <div class="rank-next" id="m-rank-next"></div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <div class="card-body">
            <div id="m-transcription" style="display:none;margin-bottom:14px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);font-size:.875rem"></div>
            <div id="m-original-marked" class="original-marked" style="font-size:.9375rem"></div>
            <div id="m-errors-section" class="errors-list" style="margin-top:16px"></div>
            <div id="m-warnings-section" class="errors-list warnings-list" style="margin-top:16px"></div>
            <div id="m-feedback-box" class="feedback-box" style="margin-top:16px"></div>
          </div>
        </div>

        <button class="big-btn big-btn-primary" id="m-btn-new" style="margin-bottom:24px">Nou dictat</button>
      </div>

    </main>
  </div>

  <!-- Modal: afegir text personal -->
  <div id="m-modal-add" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3 style="font-size:1.0625rem;font-weight:600;margin-bottom:16px">Afegir text personal</h3>
      <div class="form-group">
        <label class="form-label">Títol</label>
        <input type="text" id="m-new-title" class="form-input" placeholder="Nom del text">
      </div>
      <div class="form-group">
        <label class="form-label">Text</label>
        <textarea id="m-new-body" class="form-input textarea" placeholder="Enganxa o escriu el text. Pots separar frases amb || per marcar les pauses." style="min-height:150px"></textarea>
      </div>
      <div style="display:flex;gap:10px">
        <button class="big-btn big-btn-ghost" id="m-cancel-add">Cancel·lar</button>
        <button class="big-btn big-btn-primary" id="m-save-text">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/dictat.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    function showView(name) {
      document.querySelectorAll('.mobile-view').forEach(v => v.classList.remove('active'));
      $('m-view-' + name).classList.add('active');
      window.scrollTo(0, 0);
    }
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const LEVEL_LABELS = { basic:'Bàsic', intermedi:'Intermedi', avancat:'Avançat', personal:'Els meus textos' };

    const state = { level:'basic', selectedText:null, dictationDone:false, mode:'write', photoFile:null, dictaPuntuacio:false };
    const motor = new Dictat.MotorDictat(pintaEstat);

    // Preferències a localStorage (són ajustos); esborrany a sessionStorage i
    // fora en corregir o tancar sessió, que això és el que ha escrit algú i
    // aquests mòbils es comparteixen.
    function llegeixPref(c, d) { try { const v = localStorage.getItem('dictats:' + c); return v === null ? d : JSON.parse(v); } catch { return d; } }
    function desaPref(c, v) { try { localStorage.setItem('dictats:' + c, JSON.stringify(v)); } catch { /* privat */ } }
    function clauEsborrany() { return 'dictats:esborrany:' + (state.selectedText ? state.selectedText.id : 'cap'); }
    function desaEsborrany() { if (state.selectedText) { try { sessionStorage.setItem(clauEsborrany(), $('m-user-text').value); } catch { /* ple */ } } }
    function recuperaEsborrany() { try { return sessionStorage.getItem(clauEsborrany()) || ''; } catch { return ''; } }
    function esborraEsborrany() { try { sessionStorage.removeItem(clauEsborrany()); } catch { /* res */ } }

    async function init() {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login'; return; }

      motor.velocitat = llegeixPref('velocitat', Dictat.VELOCITAT_PER_DEFECTE);
      state.dictaPuntuacio = llegeixPref('puntuacio', false);
      motor.dictaPuntuacio = state.dictaPuntuacio;

      $('m-logout').addEventListener('click', async () => {
        try { sessionStorage.clear(); } catch { /* res */ }
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/login';
      });

      document.querySelectorAll('.mobile-level-card').forEach(card => {
        card.addEventListener('click', () => {
          document.querySelectorAll('.mobile-level-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          state.level = card.dataset.level;
          loadTexts(state.level);
        });
      });

      // Sortir del dictat el pausa; abans es quedava sonant.
      $('m-back-level').addEventListener('click', () => { motor.pausa(); showView('level'); });
      $('m-btn-start').addEventListener('click', iniciaDictat);
      $('m-btn-repeat').addEventListener('click', () => motor.repeteix());
      $('m-btn-pause').addEventListener('click', () => motor.alternaPausa());
      $('m-btn-next').addEventListener('click', () => motor.seguent());
      $('m-btn-extend').addEventListener('click', () => motor.allarga());

      $('m-mode-write').addEventListener('click', () => setMode('write'));
      $('m-mode-paper').addEventListener('click', () => setMode('paper'));
      $('m-user-text').addEventListener('input', () => { actualitzaBotoCorregir(); desaEsborrany(); });
      $('m-btn-correct').addEventListener('click', corregeixText);
      $('m-photo-input').addEventListener('change', onPhoto);
      $('m-btn-correct-photo').addEventListener('click', corregeixFoto);
      $('m-btn-skip-photo').addEventListener('click', () => { renderSenseCorreccio(); showView('results'); });
      $('m-btn-new').addEventListener('click', () => { reinicia(); showView('level'); });

      const rang = $('m-speech-rate');
      rang.value = String(motor.velocitat);
      mostraVelocitat();
      rang.addEventListener('input', () => {
        motor.velocitat = parseFloat(rang.value);
        mostraVelocitat();
        desaPref('velocitat', motor.velocitat);
      });

      const casella = $('m-dictate-punctuation');
      casella.checked = state.dictaPuntuacio;
      casella.addEventListener('change', () => {
        state.dictaPuntuacio = casella.checked;
        motor.dictaPuntuacio = casella.checked;
        desaPref('puntuacio', state.dictaPuntuacio);
      });

      $('m-btn-add-text').addEventListener('click', () => { $('m-modal-add').style.display = 'flex'; });
      $('m-cancel-add').addEventListener('click', () => { $('m-modal-add').style.display = 'none'; });
      $('m-save-text').addEventListener('click', desaTextPersonal);

      comprovaVeu();
      await loadTexts('basic');
    }

    function mostraVelocitat() {
      $('m-speech-rate-value').textContent = motor.velocitat.toFixed(2).replace('.', ',') + '×';
    }

    function comprovaVeu() {
      if (!window.speechSynthesis) return avisVeu('Aquest navegador no té síntesi de veu.');
      const revisa = () => {
        if (!window.speechSynthesis.getVoices().length) return;
        if (Dictat.veusCatalanes().length) { $('m-voice-warning').style.display = 'none'; return; }
        avisVeu('No hi ha cap veu catalana en aquest dispositiu: el dictat sonarà amb veu castellana i pronunciarà malament el català. Android: Configuració → Sistema → Idiomes → Sortida de síntesi de veu. iOS: Configuració → Accessibilitat → Contingut parlat → Veus → Català.');
      };
      revisa();
      window.speechSynthesis.onvoiceschanged = revisa;
    }
    function avisVeu(text) { $('m-voice-warning').textContent = text; $('m-voice-warning').style.display = ''; }

    // ── Llista de textos ────────────────────────────────
    async function loadTexts(level) {
      const personal = level === 'personal';
      $('m-btn-add-text').style.display = personal ? '' : 'none';
      $('m-text-list').innerHTML = '<div style="color:var(--text-muted);font-size:.875rem;padding:8px 0">Carregant…</div>';
      const res = await fetch(personal ? '/api/user-texts' : `/api/texts/${level}`);
      const texts = res.ok ? await res.json() : [];

      if (texts.length === 0) {
        $('m-text-list').innerHTML = personal
          ? '<div style="color:var(--text-muted);font-size:.875rem;padding:8px 0">Encara no tens cap text teu. Fes servir el botó de dalt.</div>'
          : '<div style="color:var(--text-muted);font-size:.875rem;padding:8px 0">No hi ha textos disponibles.</div>';
        return;
      }

      // El títol d'un text personal l'escriu qui l'ha creat: va escapat.
      $('m-text-list').innerHTML = texts.map(t => `
        <div class="mobile-text-item" data-id="${escapeHtml(t.id)}">
          <div class="mt-title">${escapeHtml(t.title)}</div>
          <div class="mt-meta">${escapeHtml(t.wordCount)} paraules · ${escapeHtml(t.description)}</div>
        </div>
      `).join('');

      document.querySelectorAll('.mobile-text-item').forEach(item => {
        item.addEventListener('click', () => selectText(item.dataset.id));
      });
    }

    async function desaTextPersonal() {
      const title = $('m-new-title').value.trim();
      const text = $('m-new-body').value.trim();
      if (!title || !text) return alert('Cal títol i text');
      const res = await fetch('/api/user-texts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, text }),
      });
      if (res.ok) {
        $('m-modal-add').style.display = 'none';
        $('m-new-title').value = '';
        $('m-new-body').value = '';
        loadTexts('personal');
      }
    }

    async function selectText(id) {
      let text;
      if (state.level === 'personal') {
        const list = await (await fetch('/api/user-texts')).json();
        text = list.find(t => t.id === id);
      } else {
        const res = await fetch(`/api/texts/${state.level}/${id}`);
        if (!res.ok) return;
        text = await res.json();
      }
      if (!text) return;

      state.selectedText = text;
      state.photoFile = null;
      $('m-dictation-title').textContent = text.title;
      $('m-level-badge').textContent = LEVEL_LABELS[state.level];
      $('m-progress-bar').style.width = '0%';
      $('m-phrase-indicator').textContent = '';
      $('m-status-badge').innerHTML = '';
      $('m-btn-start').style.display = '';
      $('m-controls').style.display = 'none';
      $('m-correction-loading').style.display = 'none';
      $('m-photo-preview').style.display = 'none';
      $('m-photo-label').textContent = 'Fer foto o triar de la galeria';
      $('m-btn-correct-photo').disabled = true;
      setMode('write');
      motor.carrega(text.text.split('||').map(s => s.trim()).filter(Boolean));
      $('m-user-text').value = recuperaEsborrany();
      actualitzaBotoCorregir();
      showView('dictation');
    }

    // ── El dictat ───────────────────────────────────────
    function iniciaDictat() {
      if (!window.speechSynthesis) { alert('Activa la síntesi de veu al dispositiu.'); return; }
      $('m-btn-start').style.display = 'none';
      $('m-controls').style.display = '';
      motor.inicia();
    }

    function pintaEstat(info) {
      $('m-progress-bar').style.width = info.progres + '%';
      state.dictationDone = info.estat === 'fet';

      if (info.estat === 'llegint') {
        $('m-phrase-indicator').textContent = `Frase ${info.frase + 1} de ${info.total}`;
        $('m-status-badge').innerHTML = '<span class="speaking-badge"><span class="dot"></span>Llegint…</span>';
        $('m-btn-pause').textContent = '⏸ Pausar';
        $('m-btn-extend').disabled = true;
      } else if (info.estat === 'pausa') {
        $('m-status-badge').innerHTML = `<span class="pause-badge">⏸ ${info.segons} s per escriure</span>`;
        $('m-btn-pause').textContent = '⏸ Pausar';
        $('m-btn-extend').disabled = false;
      } else if (info.estat === 'pausat') {
        $('m-status-badge').innerHTML = '<span class="pause-badge">⏹ Aturat</span>';
        $('m-btn-pause').textContent = '▶ Seguir';
        $('m-btn-extend').disabled = true;
      } else if (info.estat === 'fet') {
        $('m-phrase-indicator').textContent = 'Dictat completat';
        $('m-status-badge').innerHTML = '<span class="speaking-badge" style="background:var(--success-light);color:var(--success)">✓ Completat</span>';
        $('m-controls').style.display = 'none';
      }
      actualitzaBotoCorregir();
    }

    // ── Escriure o paper ────────────────────────────────
    function setMode(mode) {
      state.mode = mode;
      $('m-mode-write').classList.toggle('active', mode === 'write');
      $('m-mode-paper').classList.toggle('active', mode === 'paper');
      $('m-write-zone').style.display = mode === 'write' ? '' : 'none';
      $('m-paper-zone').style.display = mode === 'paper' ? '' : 'none';
      actualitzaBotoCorregir();
    }

    function actualitzaBotoCorregir() {
      $('m-btn-correct').disabled = $('m-user-text').value.trim().length < 3;
    }

    function onPhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      state.photoFile = file;
      $('m-photo-label').textContent = file.name;
      $('m-btn-correct-photo').disabled = false;
      const reader = new FileReader();
      reader.onload = ev => { $('m-photo-preview').src = ev.target.result; $('m-photo-preview').style.display = ''; };
      reader.readAsDataURL(file);
    }

    // ── Correcció ───────────────────────────────────────
    function comencaCorreccio(missatge) {
      motor.atura();
      $('m-btn-correct').disabled = true;
      $('m-btn-correct-photo').disabled = true;
      $('m-loading-msg').textContent = missatge;
      $('m-correction-loading').style.display = '';
    }

    // Al mòbil el botó queda a l'abast del dit mentre gira l'indicador: un
    // doble toc feia dues correccions del mateix dictat i dues files a
    // l'historial.
    function acabaCorreccio() {
      $('m-correction-loading').style.display = 'none';
      actualitzaBotoCorregir();
      $('m-btn-correct-photo').disabled = !state.photoFile;
    }

    function tornaAlLogin() {
      window.location.href = '/login';
    }

    async function corregeixText() {
      comencaCorreccio('Corregint el dictat…');
      try {
        const res = await fetch('/api/correct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            originalText: state.selectedText.text,
            userText: $('m-user-text').value.trim(),
            level: state.level,
            textId: state.selectedText.id || 'unknown',
            textTitle: state.selectedText.title || '',
            punctuationDictated: state.dictaPuntuacio,
          }),
        });
        if (res.status === 401) return tornaAlLogin();
        if (!res.ok) throw new Error((await res.json()).error);
        const correccio = await res.json();
        esborraEsborrany();
        acabaCorreccio();
        renderResults(correccio);
        showView('results');
      } catch (err) {
        acabaCorreccio();
        alert(err.message || 'Error de connexió. Torna a provar.');
      }
    }

    async function corregeixFoto() {
      comencaCorreccio('Llegint la foto i corregint…');
      const formData = new FormData();
      formData.append('photo', state.photoFile);
      formData.append('originalText', state.selectedText.text);
      formData.append('level', state.level);
      formData.append('textId', state.selectedText.id || 'unknown');
      formData.append('textTitle', state.selectedText.title || '');
      formData.append('punctuationDictated', String(state.dictaPuntuacio));
      try {
        const res = await fetch('/api/correct-image', { method: 'POST', body: formData });
        if (res.status === 401) return tornaAlLogin();
        if (!res.ok) throw new Error((await res.json()).error);
        const correccio = await res.json();
        acabaCorreccio();
        renderResults(correccio);
        showView('results');
      } catch (err) {
        acabaCorreccio();
        alert(err.message || 'Error en la correcció. Torna a provar.');
      }
    }

    // ── Resultats ───────────────────────────────────────
    // Mateixa normalització que `tokenitza()` al servidor: amb `''` un text
    // personal sense espais al voltant de `||` desplaçava totes les marques.
    function textNet() {
      return state.selectedText.text.replace(/\|\|/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function fitxaError(e) {
      return `
        <div class="error-item">
          <span class="error-type">${escapeHtml(e.type || 'error')}</span>
          <div class="error-detail">
            <div class="error-words">
              <span class="wrong">${escapeHtml(e.userWrote || '(omès)')}</span>
              <span class="arrow">→</span>
              <span class="right">${escapeHtml(e.original || '(sobra)')}</span>
            </div>
            <div class="error-explanation">
              <span>${escapeHtml(e.explanation || '')}</span>
              ${window.Avisos ? window.Avisos.boto({
                generada: e.generada,
                kind: 'explicacio',
                content: e.explanation,
                context: `${e.type || ''}: ${e.original || ''} -> ${e.userWrote || ''}`,
              }) : ''}
            </div>
          </div>
        </div>`;
    }

    function renderSenseCorreccio() {
      $('m-result-label').textContent = 'Completat';
      $('m-result-label').style.color = 'var(--primary)';
      $('m-result-sub').textContent = 'Has fet el dictat en paper.';
      $('m-result-stats').textContent = '';
      $('m-transcription').style.display = 'none';
      $('m-original-marked').innerHTML = textNet().split(/\s+/).map(w => `<span class="word-ok">${escapeHtml(w)}</span>`).join(' ');
      $('m-errors-section').innerHTML = '';
      $('m-warnings-section').innerHTML = '';
      $('m-feedback-box').textContent = '';
      $('m-rank-block').style.display = 'none';
    }

    function pintaRang(rank) {
      if (!rank || !rank.ultim) { $('m-rank-block').style.display = 'none'; return; }
      $('m-rank-block').style.display = '';

      const guanyats = rank.ultim.guanyats;
      $('m-rank-delta').textContent = (guanyats >= 0 ? '+' : '') + guanyats + ' punts';
      $('m-rank-delta').className = 'rank-delta ' + (guanyats >= 0 ? 'gain' : 'loss');
      $('m-rank-delta-note').textContent = guanyats >= 0
        ? 'Com més difícil és el text, més en val.'
        : 'A partir de sis errors es resten punts.';

      const canvi = $('m-rank-change');
      if (rank.ultim.haPujat) {
        canvi.style.display = '';
        canvi.className = 'rank-change up';
        canvi.textContent = `Has pujat a ${rank.rang.nom}!`;
      } else if (rank.ultim.haBaixat) {
        canvi.style.display = '';
        canvi.className = 'rank-change down';
        canvi.textContent = `Has baixat de ${rank.ultim.rangAnterior} a ${rank.rang.nom}.`;
      } else {
        canvi.style.display = 'none';
      }

      $('m-rank-name').textContent = rank.rang.nom;
      $('m-rank-step').textContent = `${rank.rang.nivell} de ${rank.rang.de}`;
      $('m-rank-what').textContent = rank.rang.que;
      $('m-rank-points').textContent = `${rank.punts} punts`;

      if (rank.seguent) {
        $('m-rank-bar').style.width = Math.max(0, Math.min(100, rank.seguent.progres)) + '%';
        $('m-rank-next').textContent = `Et falten ${rank.seguent.falten} punts per a ${rank.seguent.nom}.`;
      } else {
        $('m-rank-bar').style.width = '100%';
        $('m-rank-next').textContent = 'Has coronat el castell.';
      }
    }

    function renderResults(c) {
      const errors = c.errors || [];
      const warnings = c.warnings || [];
      const scale = c.scale || { label:'—', sub:'', cls:'scale-good' };
      const colors = { 'scale-excellent':'#16a34a','scale-great':'#16a34a','scale-good':'var(--primary)','scale-ok':'var(--warning)','scale-keep':'var(--error)' };

      $('m-result-label').textContent = scale.label;
      $('m-result-label').style.color = colors[scale.cls] || 'var(--primary)';
      $('m-result-sub').textContent = scale.sub;
      const afegides = errors.filter(e => e.position == null).length;
      $('m-result-stats').textContent = `${c.correctWords ?? '—'} de ${c.totalWords ?? '—'} paraules · `
        + `${errors.length} error${errors.length !== 1 ? 's' : ''}`
        + (afegides ? ` · ${afegides} de més` : '');

      if (c.transcription) {
        $('m-transcription').style.display = '';
        $('m-transcription').innerHTML = `<strong>Text llegit de la foto:</strong><br>${escapeHtml(c.transcription)}`;
      } else {
        $('m-transcription').style.display = 'none';
      }

      // Un error pot abastar més d'una paraula de l'original.
      const marques = {};
      const explicacions = {};
      const pinta = (e, classe) => {
        if (e.position == null) return;
        for (let k = 0; k < (e.span || 1); k++) {
          const p = e.position + k;
          if (classe === 'word-error' || !marques[p]) marques[p] = classe;
          explicacions[p] = e.explanation || '';
        }
      };
      errors.forEach(e => pinta(e, 'word-error'));
      warnings.forEach(e => pinta(e, 'word-warning'));

      $('m-original-marked').innerHTML = textNet().split(/\s+/).map((w, i) => {
        const titol = explicacions[i] ? ` title="${escapeHtml(explicacions[i])}"` : '';
        return `<span class="${marques[i] || 'word-ok'}"${titol}>${escapeHtml(w)}</span>`;
      }).join(' ');

      $('m-errors-section').innerHTML = errors.length
        ? `<h3>Errors detectats</h3>${errors.map(fitxaError).join('')}`
        : '';

      // La puntuació que no s'ha dictat es veu, però no puntua.
      $('m-warnings-section').innerHTML = warnings.length
        ? `<h3>Puntuació — no compta</h3><p class="warnings-note">No s'ha dictat, així que no baixa la teva escala.</p>${warnings.map(fitxaError).join('')}`
        : '';

      $('m-feedback-box').innerHTML = escapeHtml(c.feedback || '')
        + (window.Avisos ? window.Avisos.boto({
            generada: c.feedbackGenerat, kind: 'feedback', content: c.feedback,
          }) : '');
      pintaRang(c.rank);
    }

    function reinicia() {
      motor.atura();
      motor.carrega([]);
      state.selectedText = null;
      state.dictationDone = false;
      state.photoFile = null;
      $('m-user-text').value = '';
    }

    init();
  </script>
</body>
</html>
