# /etc/nginx/sites-available/dictats-usecronos.conf
#
# El domini definitiu de Dictats (decidit a la #20). Va en un fitxer a part i no
# dins de dictats.conf perquè així treure'l és esborrar un enllaç simbòlic, i
# `dictation.generaive.io` segueix servint sense que se l'hagi tocat.
#
#   sudo ln -s /etc/nginx/sites-available/dictats-usecronos.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d dictats.usecronos.com
#
# Certbot afegeix ell mateix el bloc 443 i la redirecció des del 80.

server {
    listen 80;
    listen [::]:80;
    server_name dictats.usecronos.com;

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;

        # correcció per foto (Claude Vision)
        client_max_body_size 20M;
        proxy_read_timeout   300s;
    }

    access_log /var/log/nginx/dictats-usecronos.access.log;
    error_log  /var/log/nginx/dictats-usecronos.error.log;
}
