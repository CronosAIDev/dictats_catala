# /etc/nginx/sites-available/dictats.conf
# sudo ln -s /etc/nginx/sites-available/dictats.conf /etc/nginx/sites-enabled/
# sudo certbot --nginx -d dictation.generaive.io

server {
    listen 80;
    listen [::]:80;
    server_name dictation.generaive.io;

    # certbot afegeix aquí la redirecció a HTTPS automàticament

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;

        # correcció per foto (Claude Vision)
        client_max_body_size 20M;
        proxy_read_timeout   300s;
    }

    access_log /var/log/nginx/dictats.access.log;
    error_log  /var/log/nginx/dictats.error.log;
}
